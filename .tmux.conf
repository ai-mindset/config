set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
# Replace the X clipboard on every tmux copy; do not use OSC 52
set -s set-clipboard off
set -s copy-command "xclip -in -selection clipboard"

set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Use vim keybindings in copy mode
setw -g mode-keys vi

# From shell-sage http://ssage.answer.ai/#prerequisites
# Show pane ID and time in status bar
set -g status-right '#{pane_id} | %H:%M '

# Preserve full-screen TUI rendering and restore the shell screen on exit
set-option -g alternate-screen on

# Improved search and copy bindings
bind-key / copy-mode\; send-key ?
bind-key -T copy-mode-vi y send-keys -X select-line \; send-keys -X copy-pipe-and-cancel
